<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pick your character</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@900&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #f4efe6; font-family: 'Inter Tight', sans-serif; color: #121212; }
      h1 { text-align: center; font-size: 44px; letter-spacing: -0.04em; margin: 28px 0 8px; }
      .row { display: flex; justify-content: center; gap: 28px; padding: 16px; flex-wrap: wrap; }
      figure { margin: 0; text-align: center; }
      .stage { width: 240px; height: 400px; border-radius: 28px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
      .stage img { height: 384px; width: auto; animation: idle 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
      @keyframes idle { 50% { transform: translateY(-6px) scaleY(1.01); } }
      figcaption { font: 16px Silkscreen, monospace; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Style A, no bangs</h1>
    <div class="row">
      <figure><div class="stage" style="background:#f4efe6;outline:2px dashed #0002"><img src="char-3d-cut.png" alt="Before" style="opacity:.55" /></div><figcaption>before</figcaption></figure>
      <figure><div class="stage" style="background:#fbdcea"><img src="char-3d-v2a-cut.png" alt="Middle part" /></div><figcaption>A1 · middle part</figcaption></figure>
      <figure><div class="stage" style="background:#fbdcea"><img src="char-3d-v2b-cut.png" alt="Side part" /></div><figcaption>A2 · side part</figcaption></figure>
    </div>
  </body>
</html>
