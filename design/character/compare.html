<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pick your character</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@900&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #f4efe6; font-family: 'Inter Tight', sans-serif; color: #121212; }
      h1 { text-align: center; font-size: 44px; letter-spacing: -0.04em; margin: 28px 0 8px; }
      .row { display: flex; justify-content: center; gap: 28px; padding: 16px; flex-wrap: wrap; }
      figure { margin: 0; text-align: center; }
      .stage { width: 200px; height: 360px; border-radius: 28px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
      .stage img { height: 340px; width: auto; animation: idle 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
      @keyframes idle { 50% { transform: translateY(-6px) scaleY(1.01); } }
      figcaption { font: 16px Silkscreen, monospace; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Your character · A2 poses</h1>
    <div class="row">
      <figure><div class="stage" style="background:#fbdcea"><img src="pose-idle-cut.png" alt="idle" /></div><figcaption>idle</figcaption></figure>
      <figure><div class="stage" style="background:#d9ccff"><img src="pose-wave-cut.png" alt="wave" /></div><figcaption>wave</figcaption></figure>
      <figure><div class="stage" style="background:#dcefc3"><img src="pose-run-cut.png" alt="run" /></div><figcaption>run</figcaption></figure>
      <figure><div class="stage" style="background:#bfe3ff"><img src="pose-play-cut.png" alt="play" /></div><figcaption>play</figcaption></figure>
      </div>
  </body>
</html>
