<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Board preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #f4efe6; }
      #board svg { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <script>
      fetch('portfolio-board.svg').then((r) => r.text()).then(async (s) => {
        await document.fonts.ready
        document.getElementById('board').innerHTML = s
      })
    </script>
  </body>
</html>
